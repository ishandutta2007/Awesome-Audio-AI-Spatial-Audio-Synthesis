<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
      }
      .gradient-title {
        fill: url(#accentGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e0e7ff;
      }
      .pulse-circle {
        transform-origin: center;
        animation: pulseScale 4s ease-in-out infinite alternate;
      }
      .wave-bar {
        transform-origin: bottom;
        animation: soundBounce 1.5s ease-in-out infinite alternate;
      }
      .ripple {
        transform-origin: center;
        animation: rippleExpand 5s linear infinite;
      }
      @keyframes pulseScale {
        0% { transform: scale(0.9); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.65; }
      }
      @keyframes rippleExpand {
        0% { r: 35px; opacity: 0.8; stroke-width: 2.5; }
        50% { opacity: 0.4; }
        100% { r: 125px; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes soundBounce {
        0% { transform: scaleY(0.3); }
        50% { transform: scaleY(1.0); }
        100% { transform: scaleY(0.45); }
      }
      .wb-1 { animation-delay: 0.1s; }
      .wb-2 { animation-delay: 0.3s; }
      .wb-3 { animation-delay: 0.5s; }
      .wb-4 { animation-delay: 0.2s; }
      .wb-5 { animation-delay: 0.4s; }
      .wb-6 { animation-delay: 0.6s; }
      .wb-7 { animation-delay: 0.15s; }
      .wb-8 { animation-delay: 0.45s; }
      .wb-9 { animation-delay: 0.35s; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Ambience Orbs (Animated / Dynamic) -->
  <circle cx="180" cy="110" r="140" fill="url(#orbGrad1)" class="pulse-circle" />
  <circle cx="1040" cy="300" r="160" fill="url(#orbGrad2)" class="pulse-circle" style="animation-delay: -2s;" />

  <!-- Background Grid Mesh -->
  <g stroke="#334155" stroke-width="0.75" stroke-opacity="0.25">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Right Side Visual: 3D Spatial Audio & Waveform Visualization (Dynamic & Constrained) -->
  <g transform="translate(980, 160)">
    <!-- 3D Spatial Sphere Ripples -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#38bdf8" class="ripple" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#818cf8" class="ripple" style="animation-delay: -1.7s;" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#c084fc" class="ripple" style="animation-delay: -3.4s;" />
    
    <!-- Central Spatial Node -->
    <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)" />
    <!-- Audio Speaker Icon Inside Node -->
    <path d="M-8 -6 L-4 -6 L2 -11 L2 11 L-4 6 L-8 6 Z" fill="#38bdf8" />
    <path d="M5 -5 C7 -3 7 3 5 5" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M8 -9 C11 -5 11 5 8 9" stroke="#818cf8" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>

  <!-- Mini Dynamic Audio Spectrum Bars (at bottom right, non-overlapping) -->
  <g transform="translate(850, 310)">
    <!-- 9 Dynamic Equalizer Bars -->
    <g transform="translate(0, 0)">
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" class="wave-bar wb-1" />
      <line x1="16" y1="0" x2="16" y2="-60" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" class="wave-bar wb-2" />
      <line x1="32" y1="0" x2="32" y2="-80" stroke="#818cf8" stroke-width="6" stroke-linecap="round" class="wave-bar wb-3" />
      <line x1="48" y1="0" x2="48" y2="-95" stroke="#818cf8" stroke-width="6" stroke-linecap="round" class="wave-bar wb-4" />
      <line x1="64" y1="0" x2="64" y2="-110" stroke="#a855f7" stroke-width="6" stroke-linecap="round" class="wave-bar wb-5" />
      <line x1="80" y1="0" x2="80" y2="-85" stroke="#a855f7" stroke-width="6" stroke-linecap="round" class="wave-bar wb-6" />
      <line x1="96" y1="0" x2="96" y2="-65" stroke="#c084fc" stroke-width="6" stroke-linecap="round" class="wave-bar wb-7" />
      <line x1="112" y1="0" x2="112" y2="-50" stroke="#c084fc" stroke-width="6" stroke-linecap="round" class="wave-bar wb-8" />
      <line x1="128" y1="0" x2="128" y2="-30" stroke="#e879f9" stroke-width="6" stroke-linecap="round" class="wave-bar wb-9" />
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle & Feature Badges -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <text x="32" y="21" class="tag-text" fill="#38bdf8">AUDIO AI &amp; 3D SPATIAL</text>

    <!-- Main Title -->
    <text x="0" y="90" class="title-text">
      Awesome Audio AI &amp;
    </text>
    <text x="0" y="145" class="title-text gradient-title" filter="url(#subtleGlow)">
      Spatial Audio Synthesis
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle-text">
      Curated ecosystem of SaaS tools, neural speech synthesis, binaural HRTF &amp; open-source DSP
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 230)">
      <!-- Pill 1: Neural Speech & Voice -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="14" y="22" class="tag-text">🎙️ Neural Voice / TTS</text>

      <!-- Pill 2: 3D Binaural & Ambisonics -->
      <rect x="175" y="0" width="190" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="189" y="22" class="tag-text">🎧 3D Binaural / HRTF</text>

      <!-- Pill 3: Speech Enhancement -->
      <rect x="380" y="0" width="180" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="394" y="22" class="tag-text">✨ Speech Enhancement</text>

      <!-- Pill 4: Open-Source DAWs & DSP -->
      <rect x="575" y="0" width="185" height="34" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
      <text x="589" y="22" class="tag-text">🎛️ Modular DAWs &amp; DSP</text>
    </g>
  </g>
</svg>
